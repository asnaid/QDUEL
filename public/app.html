<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Akademi Logika C++</title>
<link rel="stylesheet" href="/app.css">
<style>
  .tutorial-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.98); 
    display: flex; align-items: center; justify-content: center; 
    z-index: 999; padding: 20px; text-align: center; backdrop-filter: blur(5px);
  }
  .tutorial-box {
    background: #1e293b; padding: 24px; border-radius: 16px; 
    max-width: 450px; width: 100%; border: 2px solid #3b82f6; 
    box-shadow: 0 0 30px rgba(59,130,246,0.3); text-align: left;
  }
  .tutorial-icon { font-size: 40px; margin-bottom: 10px; text-align: center; display: block; }
  .tut-title { color: #60a5fa; font-size: 20px; font-weight: bold; margin-bottom: 12px; text-align: center;}
  .tut-text { font-size: 14px; line-height: 1.6; color: #cbd5e1; margin-bottom: 20px; }
  
  .tut-question-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
  .tut-code { font-family: monospace; color: #a78bfa; font-size: 14px; margin-bottom: 10px; white-space: pre-wrap; }
  .tut-option { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 6px; text-align: left; cursor: pointer; font-size: 14px; transition: 0.2s; }
  .tut-option:hover { background: #334155; }
  .tut-option.correct { background: #166534; border-color: #4ade80; }
  .tut-option.wrong { background: #7f1d1d; border-color: #f87171; }
</style>
</head>
<body>

<!-- OVERLAY TUTORIAL -->
<div id="tutorial-modal" class="tutorial-overlay hidden">
  <div class="tutorial-box" id="tut-box">
    <span class="tutorial-icon" id="tut-icon">🏫</span>
    <div class="tut-title" id="tut-title">Selamat Datang di Akademi!</div>
    <div class="tut-text" id="tut-text"></div>
    <div id="tut-interactive-area"></div>
    <button class="btn-primary hidden" id="tut-btn" onclick="nextTutorial()">Lanjut</button>
  </div>
</div>

<div id="lobby-screen">
  <div class="container">
    <div class="header">
      <div>
        <div class="name" id="name">...</div>
        <div class="rating">Poin: <b id="rating">-</b></div>
      </div>
      <div style="display:flex; gap: 8px;">
        <button class="btn-logout" onclick="openProfile()">Profil</button>
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </div>
    <div class="card center">
      <div class="status-wrap">
        <div id="spinner" class="spinner hidden"></div>
        <div id="status" class="status" style="margin-bottom: 0;">Siap mengikuti Duel</div>
      </div>
      <button id="btn-search" class="btn-primary btn-pulse" onclick="search()">Mulai Duel</button>
      <button id="btn-bot" class="btn-secondary hidden" onclick="acceptBot()">Latihan vs Komputer</button>
      <button id="btn-cancel" class="btn-secondary hidden" onclick="cancel()">Batal</button>
      <button class="btn-secondary" onclick="openLeaderboard()" style="margin-top: 20px;">🏆 Papan Juara</button>
    </div>
    
    <div class="card" id="history-card" style="display: none;">
      <h2>5 Duel Terakhir</h2>
      <div id="history-list" style="font-size: 14px;"></div>
    </div>
  </div>
</div>

<div id="battle-screen" class="hidden">
  <div class="battle-container">
    <div class="hp-row">
      <div class="hp-player">
        <div class="hp-name" id="name-a">Kamu</div>
        <div class="hp-bar"><div class="hp-fill" id="hp-a"></div></div>
        <div class="hp-num">HP: <span id="hp-a-num">100</span></div>
      </div>
      <div class="round-info"><div id="round">Soal 1/5</div></div>
      <div class="hp-player right">
        <div class="hp-name" id="name-b">Lawan</div>
        <div class="hp-bar"><div class="hp-fill" id="hp-b"></div></div>
        <div class="hp-num">HP: <span id="hp-b-num">100</span></div>
      </div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="question-area">
      <pre class="code"><code id="code">...</code></pre>
      <div class="options" id="options"></div>
    </div>
    <div id="reveal" class="reveal hidden">
      <div class="reveal-content">
        <div id="reveal-title" class="reveal-title"></div>
        <div id="reveal-explanation" class="reveal-explanation"></div>
        <div id="reveal-damage" class="reveal-damage"></div>
      </div>
    </div>
    <div id="end" class="end hidden">
      <div class="end-content">
        <div id="end-title" class="end-title"></div>
        <div id="end-details" class="end-details"></div>
        <button class="btn-primary" onclick="location.reload()">Kembali ke Lobi</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Leaderboard & Profile -->
<div id="leaderboard-modal" class="end hidden">
  <div class="end-content">
    <h2 style="color: #fbbf24; margin-bottom: 16px;">🏆 Papan Juara</h2>
    <div id="leaderboard-list" style="text-align: left; margin-bottom: 20px; font-size: 15px;"></div>
    <div id="my-rank-info" style="padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #60a5fa;"></div>
    <button class="btn-primary" onclick="closeLeaderboard()">Tutup</button>
  </div>
</div>

<div id="profile-modal" class="end hidden">
  <div class="end-content">
    <h2 style="color: #60a5fa; margin-bottom: 16px;">👤 Pengaturan Akun</h2>
    <div style="text-align: left; margin-bottom: 20px; font-size: 14px; background: #0f172a; padding: 12px; border-radius: 8px;">
      <div style="color: #f87171; margin-bottom: 4px; font-size: 11px;">🔒 Identitas Siswa:</div>
      <div id="prof-fullname" style="font-weight: bold; margin-bottom: 4px;">...</div>
      <div id="prof-class" style="font-weight: bold; color: #94a3b8; font-size: 12px; margin-bottom: 12px;">...</div>
      <div style="color: #60a5fa; margin-bottom: 4px; font-size: 11px;">🌐 Username (Nama Tampil):</div>
      <div id="prof-username-display" style="font-weight: bold;">...</div>
    </div>
    <div style="text-align: left;">
      <label style="font-size: 13px; color: #94a3b8;">Ganti Username:</label>
      <input id="prof-new-username" placeholder="Username baru..." style="margin-top:4px; margin-bottom:4px;">
      <div id="prof-username-status" style="font-size: 12px; margin-bottom: 10px; padding-left: 4px;"></div>
      <label style="font-size: 13px; color: #94a3b8;">Ganti Password (Opsional):</label>
      <input id="prof-new-password" type="password" placeholder="Password baru..." style="margin-top:4px;">
    </div>
    <button class="btn-primary" onclick="saveProfile()" style="margin-top: 16px;">Simpan</button>
    <button class="btn-secondary" onclick="closeProfile()">Batal</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket, matchInfo = null, currentRound = 0, answered = false, timerInterval;
let isPlayerB = false;
let myProfileData = null;
let tutStep = 1;
let matchmakingSeconds = 0;
let matchmakingInterval = null;

async function init() {
  const r = await fetch('/api/me');
  if (!r.ok) return location.href = '/';
  const me = await r.json();
  myProfileData = me;
  
  document.getElementById('name').textContent = me.username;
  document.getElementById('rating').textContent = me.rating;

  if (!me.has_seen_tutorial) {
    document.getElementById('tutorial-modal').classList.remove('hidden');
    renderTutorial();
  }

  socket = io();
  
  socket.on('force_logout', async () => {
    await fetch('/api/logout', { method: 'POST' });
    alert('Akunmu terdeteksi login di perangkat lain.');
    location.href = '/';
  });

  socket.on('disconnect', async (reason) => {
    if (reason === 'io server disconnect') {
      await fetch('/api/logout', { method: 'POST' });
      alert('Sesi kamu berakhir.');
      location.href = '/';
    }
  });

  socket.on('connect_error', async (err) => {
    if (err.message.includes('Sesi berakhir')) {
      await fetch('/api/logout', { method: 'POST' });
      alert('Sesi kamu berakhir.');
      location.href = '/';
    }
  });
  
  socket.on('queue:waiting', () => {
    // Timer matchmaking dihandle dari frontend
  });

  socket.on('error:msg', (data) => {
    alert(data.message);
    document.getElementById('spinner').classList.add('hidden');
    document.getElementById('btn-search').classList.remove('hidden');
    document.getElementById('btn-cancel').classList.add('hidden');
    document.getElementById('status').textContent = 'Siap mengikuti Duel';
    clearInterval(matchmakingInterval);
  });
  
  socket.on('queue:offer-bot', () => {
    if (matchInfo) return;
    document.getElementById('spinner').classList.add('hidden');
    const btn = document.getElementById('btn-bot');
    if (!btn.classList.contains('hidden')) return;
    btn.classList.remove('hidden');
    document.getElementById('status').textContent = `Belum ada lawan. Coba Latihan vs Komputer?`;
  });

  socket.on('match:start', data => {
    clearInterval(matchmakingInterval);
    document.getElementById('spinner').classList.add('hidden');
    matchInfo = data;
    isPlayerB = data.you === 'b';
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('battle-screen').classList.remove('hidden');
    
    const myName = isPlayerB ? data.playerB.name : data.playerA.name;
    const oppName = isPlayerB ? data.playerA.name : data.playerB.name;
    
    document.getElementById('name-a').textContent = myName;
    document.getElementById('name-b').textContent = oppName;
  });

  socket.on('round:start', onRoundStart);
  socket.on('round:reveal', onReveal);
  socket.on('match:end', onEnd);

  loadHistory();
}

// === LOGIKA TUTORIAL INTERAKTIF ===
function renderTutorial() {
  const icon = document.getElementById('tut-icon');
  const title = document.getElementById('tut-title');
  const text = document.getElementById('tut-text');
  const area = document.getElementById('tut-interactive-area');
  const btn = document.getElementById('tut-btn');

  area.innerHTML = '';
  btn.classList.add('hidden');

  if (tutStep === 1) {
    icon.textContent = '🏫';
    title.textContent = 'Selamat Datang di Akademi!';
    text.innerHTML = 'Halo, Siswa Baru! Di Akademi Logika C++ ini, kamu akan menguji pemahaman pemrogramanmu dengan berduel melawan siswa lain.<br><br>Siap memulai ujian pertamamu?';
    btn.classList.remove('hidden');
    btn.textContent = 'Lanjut';
  } 
  else if (tutStep === 2) {
    icon.textContent = '📝';
    title.textContent = 'Sistem Duel';
    text.innerHTML = 'Setiap Duel terdiri dari 5 soal. Kamu harus menjawab soal C++ dengan benar untuk menyerang <b>HP</b> lawan.<br><br>Jika HP lawan habis (0), kamu menang. Jika HP-mu habis, kamu kalah.';
    btn.classList.remove('hidden');
    btn.textContent = 'Lanjut';
  }
  else if (tutStep === 3) {
    icon.textContent = '💻';
    title.textContent = 'Uji Coba Logika';
    text.innerHTML = 'Coba jawab soal ini untuk melanjutkan:';
    
    area.innerHTML = `
      <div class="tut-question-box">
        <div class="tut-code">int a = 5;
int b = 2;
cout << a / b;</div>
        <button class="tut-option" onclick="checkTutAnswer(0, this)">A. 2.5</button>
        <button class="tut-option" onclick="checkTutAnswer(1, this)">B. 2</button>
        <button class="tut-option" onclick="checkTutAnswer(2, this)">C. 3</button>
      </div>
    `;
  }
  else if (tutStep === 4) {
    icon.textContent = '💥';
    title.textContent = 'Aturan Damage & Serangan';
    text.innerHTML = `
      Berikut adalah pengurangan HP di setiap ronde:<br><br>
      <ul style="padding-left: 20px; margin-bottom: 10px; font-size: 13px;">
        <li><b>Kamu Benar, Lawan Salah:</b> Lawan -25 HP.</li>
        <li><b>Kamu Benar & Lebih Cepat:</b> Lawan -35 HP, Kamu -15 HP.</li>
        <li><b>Kamu Benar tapi Lebih Lambat:</b> Kamu -35 HP, Lawan -15 HP.</li>
        <li><b>Kamu Salah (Lawan Benar):</b> Kamu -25 HP.</li>
        <li><b>Keduanya Salah:</b> Tidak ada HP yang berkurang.</li>
        <li><b>Waktu Habis (Timeout):</b> Kamu -15 HP.</li>
      </ul>
    `;
    btn.classList.remove('hidden');
    btn.textContent = 'Lanjut';
  }
  else if (tutStep === 5) {
    icon.textContent = '🏆';
    title.textContent = 'Kondisi Menang & Seri';
    text.innerHTML = `
      <b>Bagaimana cara menang?</b><br>
      1. HP lawan mencapai 0 (K.O).<br>
      2. Setelah 5 ronde, HP-mu lebih tinggi dari lawan.<br><br>
      <b>Jika HP sama kuat (Seri)?</b><br>
      Pemenang ditentukan oleh: Jumlah jawaban benar terbanyak -> Rata-rata waktu jawab tercepat -> Ronde tambahan (Sudden Death).
    `;
    btn.classList.remove('hidden');
    btn.textContent = 'Mengerti, Mulai Ujian!';
  }
}

function checkTutAnswer(index, btn) {
  if (index === 1) { // Jawaban B (2)
    btn.classList.add('correct');
    document.getElementById('tut-text').innerHTML = '<b>Tepat sekali!</b> Karena a dan b adalah integer, 5 dibagi 2 dibulatkan ke bawah menjadi 2.';
    const opts = document.querySelectorAll('.tut-option');
    opts.forEach(o => o.disabled = true);
    
    const btnLanjut = document.getElementById('tut-btn');
    btnLanjut.classList.remove('hidden');
    btnLanjut.textContent = 'Lanjut';
    btnLanjut.onclick = () => { tutStep = 4; renderTutorial(); };
  } else {
    btn.classList.add('wrong');
    document.getElementById('tut-text').innerHTML = '<span style="color:#f87171;"><b>Belum tepat.</b> Ingat, pembagian dua integer akan menghasilkan integer (desimal dibuang). Coba lagi!</span>';
    setTimeout(() => btn.classList.remove('wrong'), 1000);
  }
}

async function nextTutorial() {
  if (tutStep === 5) {
    document.getElementById('tutorial-modal').classList.add('hidden');
    await fetch('/api/tutorial-done', { method: 'POST' });
  } else {
    tutStep++;
    renderTutorial();
  }
}

async function openProfile() {
  document.getElementById('prof-fullname').textContent = myProfileData.full_name;
  document.getElementById('prof-class').textContent = myProfileData.class_code || '-';
  document.getElementById('prof-username-display').textContent = myProfileData.username;
  document.getElementById('prof-new-username').value = myProfileData.username;
  document.getElementById('prof-new-password').value = '';
  document.getElementById('prof-username-status').innerHTML = '';
  document.getElementById('profile-modal').classList.remove('hidden');
}

function closeProfile() { document.getElementById('profile-modal').classList.add('hidden'); }

document.getElementById('prof-new-username').addEventListener('blur', async (e) => {
  const val = e.target.value.trim();
  const statusEl = document.getElementById('prof-username-status');
  if (!val || val === myProfileData.username) { statusEl.innerHTML = ''; return; }
  if (/\s/.test(val)) { statusEl.innerHTML = '<span style="color: #f87171;">❌ Tidak boleh pakai spasi</span>'; return; }
  statusEl.innerHTML = '<span style="color: #94a3b8;">⏳ Mengecek...</span>';
  try {
    const r = await fetch('/api/check-username?username=' + encodeURIComponent(val) + '&excludeId=' + myProfileData.id);
    const data = await r.json();
    if (data.available) statusEl.innerHTML = '<span style="color: #4ade80;">✅ Tersedia!</span>';
    else statusEl.innerHTML = '<span style="color: #f87171;">❌ Sudah dipakai</span>';
  } catch (err) { statusEl.innerHTML = ''; }
});

async function saveProfile() {
  const newUsername = document.getElementById('prof-new-username').value;
  const newPassword = document.getElementById('prof-new-password').value;
  if (!newUsername) return alert('Nama tidak boleh kosong');
  try {
    const r = await fetch('/api/update-profile', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ newUsername, newPassword })
    });
    if (r.ok) { alert('Berhasil diperbarui!'); location.reload(); }
    else alert((await r.json()).error);
  } catch (e) { alert('Gagal menyimpan.'); }
}

function updateHpBar(hp, elementId) {
  const el = document.getElementById(elementId);
  el.style.width = hp + '%';
  if (hp > 50) {
    el.style.backgroundColor = '#4ade80'; el.classList.remove('hp-danger');
  } else if (hp > 25) {
    el.style.backgroundColor = '#fbbf24'; el.classList.remove('hp-danger');
  } else {
    el.style.backgroundColor = '#f87171'; el.classList.add('hp-danger');
  }
}

function search() {
  socket.emit('queue:join');
  document.getElementById('btn-search').classList.add('hidden');
  document.getElementById('btn-search').classList.remove('btn-pulse');
  document.getElementById('btn-cancel').classList.remove('hidden');
  document.getElementById('btn-bot').classList.add('hidden');
  document.getElementById('spinner').classList.remove('hidden');

  matchmakingSeconds = 0;
  document.getElementById('status').textContent = `Mencari lawan... (00:00)`;
  clearInterval(matchmakingInterval);
  matchmakingInterval = setInterval(() => {
    matchmakingSeconds++;
    document.getElementById('status').textContent = `Mencari lawan... (00:${matchmakingSeconds < 10 ? '0' : ''}${matchmakingSeconds})`;
  }, 1000);
}

function cancel() {
  socket.emit('queue:leave');
  clearInterval(matchmakingInterval);
  document.getElementById('btn-search').classList.remove('hidden');
  document.getElementById('btn-search').classList.add('btn-pulse');
  document.getElementById('btn-cancel').classList.add('hidden');
  document.getElementById('btn-bot').classList.add('hidden');
  document.getElementById('status').textContent = 'Siap mengikuti Duel';
  document.getElementById('spinner').classList.add('hidden');
}

function acceptBot() { socket.emit('queue:accept-bot'); }

function onRoundStart(data) {
  answered = false;
  currentRound = Number(data.round);
  document.getElementById('round').textContent = `Soal ${data.round}/5`;
  document.getElementById('code').textContent = data.code;
  
  const myHp = isPlayerB ? data.hp.b : data.hp.a;
  const oppHp = isPlayerB ? data.hp.a : data.hp.b;
  
  document.getElementById('hp-a-num').textContent = myHp;
  document.getElementById('hp-b-num').textContent = oppHp;
  updateHpBar(myHp, 'hp-a');
  updateHpBar(oppHp, 'hp-b');

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  data.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = o;
    b.onclick = () => submitAnswer(i, b);
    opts.appendChild(b);
  });

  document.getElementById('reveal').classList.add('hidden');
  clearInterval(timerInterval);
  
  const totalSeconds = 90; 
  let timeLeft = totalSeconds;
  document.getElementById('timer-fill').style.width = '100%';
  
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) { 
      clearInterval(timerInterval); 
      document.getElementById('timer-fill').style.width = '0%'; 
      if (!answered) document.getElementById('round').textContent = 'Waktu habis...'; 
      return; 
    }
    document.getElementById('timer-fill').style.width = (timeLeft / totalSeconds * 100) + '%';
  }, 100);
}

function submitAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval); 
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  btn.classList.add('selected');
  document.getElementById('round').textContent = 'Menunggu lawan...';
  if (navigator.vibrate) navigator.vibrate(40);
  socket.emit('round:answer', { matchId: matchInfo.matchId, round: Number(currentRound), answerIndex: Number(idx) });
}

function onReveal(data) {
  clearInterval(timerInterval);
  document.getElementById('timer-fill').style.width = '0%';
  
  const myHp = isPlayerB ? data.hp.b : data.hp.a;
  const oppHp = isPlayerB ? data.hp.a : data.hp.b;
  
  document.getElementById('hp-a-num').textContent = myHp;
  document.getElementById('hp-b-num').textContent = oppHp;
  updateHpBar(myHp, 'hp-a');
  updateHpBar(oppHp, 'hp-b');

  let title = '';
  const mySide = isPlayerB ? 'b' : 'a';
  
  if (data.reason === 'both_timeout') title = 'Waktu Habis untuk Keduanya ⏰';
  else if (data.reason === 'both_wrong') title = 'Keduanya Salah ❌';
  else if (data.reason === 'a_faster' || data.reason === 'b_faster') {
    const fasterSide = data.reason.startsWith('a') ? 'a' : 'b';
    title = (fasterSide === mySide) ? 'Kamu Lebih Cepat! ⚡' : 'Lawan Lebih Cepat';
  }
  else if (data.reason.includes('_correct')) {
    if (data.reason.startsWith(mySide)) title = 'Jawabanmu Benar! ✅';
    else title = 'Lawan Benar ❌';
  }
  else if (data.reason.includes('_timeout')) {
    if (data.reason.startsWith(mySide)) title = 'Kamu Kehabisan Waktu ⏰';
    else title = 'Lawan Kehabisan Waktu';
  }

  const isDamageToMe = (isPlayerB ? data.damage.b : data.damage.a) > 0;
  if (isDamageToMe) {
    document.body.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  } else {
    if (navigator.vibrate) navigator.vibrate(100);
  }
  setTimeout(() => document.body.classList.remove('shake'), 500);

  document.getElementById('reveal-title').textContent = title;
  document.getElementById('reveal-explanation').textContent = data.explanation || '';
  
  const myDmg = isPlayerB ? data.damage.b : data.damage.a;
  const oppDmg = isPlayerB ? data.damage.a : data.damage.b;
  
  let d = '';
  if (myDmg > 0) d += `Kamu -${myDmg} HP  `;
  if (oppDmg > 0) d += `Lawan -${oppDmg} HP`;
  document.getElementById('reveal-damage').textContent = d || 'Tidak ada damage';
  
  document.getElementById('reveal').classList.remove('hidden');
}

function onEnd(data) {
  clearInterval(timerInterval);
  document.getElementById('reveal').classList.add('hidden'); 
  
  const iWon = data.winner === matchInfo.you;
  let title = iWon ? '🎉 MENANG!' : 'Belum Beruntung';
  
  if (data.reason === 'disconnect') {
    title = iWon ? '🎉 MENANG! (Lawan Keluar)' : 'Kalah (Kamu Keluar)';
  }
  
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-title').className = 'end-title ' + (iWon ? 'win' : 'lose');
  
  const myRating = isPlayerB ? data.rating.b : data.rating.a;
  const myHpEnd = isPlayerB ? data.hp.b : data.hp.a;
  const oppHpEnd = isPlayerB ? data.hp.a : data.hp.b;
  
  let d = `Sisa HP: ${myHpEnd} vs ${oppHpEnd}<br>`;
  d += `Poin: ${myRating.before} → ${myRating.after} (${myRating.change >= 0 ? '+' : ''}${myRating.change})`;
  
  if (data.reason === 'disconnect') {
    d += `<br><br><span style="color:#4ade80; font-size: 14px;">Duel berakhir karena pemain terputus.</span>`;
  }

  document.getElementById('end-details').innerHTML = d;
  document.getElementById('end').classList.remove('hidden');
}

async function openLeaderboard() {
  try {
    const r = await fetch('/api/leaderboard');
    if (!r.ok) return alert('Gagal memuat peringkat');
    const data = await r.json();
    const list = document.getElementById('leaderboard-list');
    list.innerHTML = '';
    data.top10.forEach((user, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
      list.innerHTML += `<div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid #334155;">
        <span>${medal} ${user.username}</span><span style="color:#60a5fa; font-weight:bold;">${user.rating}</span>
      </div>`;
    });
    document.getElementById('my-rank-info').innerHTML = `Posisi Kamu: Peringkat ${data.myRank} <br> Poin: ${data.myRating}`;
    document.getElementById('leaderboard-modal').classList.remove('hidden');
  } catch (err) { alert('Terjadi kesalahan jaringan.'); }
}

function closeLeaderboard() { document.getElementById('leaderboard-modal').classList.add('hidden'); }

async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    if (!r.ok) return;
    const data = await r.json();
    if (data.length === 0) return;
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    data.forEach(match => {
      const color = match.iWon ? '#4ade80' : '#f87171';
      const resultText = match.iWon ? 'Menang' : 'Kalah';
      const ratingColor = match.ratingChange > 0 ? '#4ade80' : (match.ratingChange < 0 ? '#f87171' : '#94a3b8');
      const ratingStr = match.ratingChange > 0 ? `+${match.ratingChange}` : match.ratingChange;
      const botText = match.isBot ? ' (Komputer)' : '';
      list.innerHTML += `
        <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155;">
          <div><span style="color: ${color}; font-weight: bold;">${resultText}</span> <span style="color: #cbd5e1;">vs ${match.opponent}${botText}</span></div>
          <div style="text-align: right;">
            <span style="color: #94a3b8; font-size: 12px;">${match.myHp} - ${match.oppHp}</span>
            <span style="color: ${ratingColor}; font-weight: bold; margin-left: 8px;">${ratingStr}</span>
          </div>
        </div>
      `;
    });
    document.getElementById('history-card').style.display = 'block';
  } catch (e) {}
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

init();
</script>
